<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      margin: 0;
    }
    .converter-card {
      background: #e6e8eb;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
    }
    
    /* Screen Display Container */
    .screen-container {
      background: #73b8c8;
      border: 2px solid #4a94a5;
      border-radius: 8px;
      padding: 12px 16px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    }

    /* Screen Top Bar */
    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 24px;
    }
    .app-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a3c45;
      text-transform: uppercase;
    }
    .share-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      color: #1a3c45;
      box-shadow: none;
    }
    .share-btn:active {
      opacity: 0.6;
      background: none;
    }
    .share-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .display-body {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      min-height: 70px;
    }

    .input-text {
      font-size: 2.2rem;
      color: #000;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Extra-Large, Sharp Typography */
    .mixed-number {
      display: inline-flex;
      align-items: center;
      color: #000;
      line-height: 1;
    }
    
    .whole-part {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -2px;
      margin-right: 8px;
      -webkit-font-smoothing: antialiased;
    }
    
    .fraction-part {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: 1.8rem;
      font-weight: 800;
    }
    
    .numerator {
      border-bottom: 3px solid #000;
      padding: 0 4px 1px 4px;
      text-align: center;
      width: 100%;
    }
    
    .denominator {
      padding: 1px 4px 0 4px;
      text-align: center;
      width: 100%;
    }

    /* Keypad Styling */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button {
      padding: 14px;
      font-size: 1.3rem;
      font-weight: 700;
      border: 1px solid #b5b8bc;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #d8dcd0 100%);
      color: #111;
      cursor: pointer;
      box-shadow: 0 3px 0 #a2a6ab, 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #a2a6ab, 0 2px 3px rgba(0,0,0,0.1);
    }
    button.op-btn {
      background: linear-gradient(180deg, #e4edfd 0%, #b5cef7 100%);
      color: #003670;
      border-color: #9cbce8;
      box-shadow: 0 3px 0 #85a8da;
    }
    button.clear-btn {
      background: linear-gradient(180deg, #fde4e4 0%, #f7b5b5 100%);
      color: #8c0000;
      border-color: #e89c9c;
      box-shadow: 0 3px 0 #da8585;
    }
    button.equals-btn {
      grid-column: span 2;
      background: linear-gradient(180deg, #ffa41b 0%, #e07b00 100%);
      color: #fff;
      border-color: #c96f00;
      box-shadow: 0 3px 0 #b06100;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <div class="screen-container">
      <div class="screen-header">
        <span class="app-title">Fraction Calculator</span>
        <button class="share-btn" onclick="shareResult()" title="Share Result">
          <svg viewBox="0 0 24 24">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
          </svg>
        </button>
      </div>
      <div class="display-body" id="display-screen">
        <span class="input-text"></span>
      </div>
    </div>

    <div class="keypad">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>

      <button class="clear-btn" onclick="clearAll()">C</button>
      <button onclick="press('0')">0</button>
      <button class="op-btn" onclick="backspace()">⌫</button>

      <button class="op-btn" onclick="press('.')">.</button>
      <button class="op-btn" onclick="press('/')">/</button>
      <button class="equals-btn" style="grid-column: span 1;" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let inputString = "";
    let lastCalculatedText = "";

    function press(val) {
      if (val === '/') {
        if (inputString === "" || inputString.includes('/')) return;
      }
      if (val === '.') {
        // Prevent multiple decimals within the same segment
        const parts = inputString.split('/');
        const currentPart = parts[parts.length - 1];
        if (currentPart.includes('.')) return;
      }
      inputString += val;
      renderInput();
    }

    function backspace() {
      inputString = inputString.slice(0, -1);
      renderInput();
    }

    function clearAll() {
      inputString = "";
      lastCalculatedText = "";
      document.getElementById('display-screen').innerHTML = `<span class="input-text"></span>`;
    }

    function renderInput() {
      document.getElementById('display-screen').innerHTML = `<span class="input-text">${inputString}</span>`;
    }

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    // Convert decimal to pure fraction [num, den]
    function decimalToFraction(val) {
      if (!val.includes('.')) {
        return [parseInt(val, 10), 1];
      }
      const decPlaces = val.split('.')[1].length;
      const den = Math.pow(10, decPlaces);
      const num = Math.round(parseFloat(val) * den);
      return [num, den];
    }

    function calculate() {
      if (!inputString) return;

      let num, den;

      if (inputString.includes('/')) {
        const parts = inputString.split('/');
        if (!parts[0] || !parts[1]) {
          showError();
          return;
        }

        const [n1, d1] = decimalToFraction(parts[0]);
        const [n2, d2] = decimalToFraction(parts[1]);

        num = n1 * d2;
        den = d1 * n2;
      } else if (inputString.includes('.')) {
        [num, den] = decimalToFraction(inputString);
      } else {
        // Simple whole number entered
        num = parseInt(inputString, 10);
        den = 1;
      }

      if (isNaN(num) || isNaN(den) || den === 0) {
        showError();
        return;
      }

      const whole = Math.floor(num / den);
      const remNumerator = num % den;

      // Render: Pure Whole Number
      if (remNumerator === 0) {
        document.getElementById('display-screen').innerHTML = `<div class="mixed-number"><span class="whole-part">${whole}</span></div>`;
        lastCalculatedText = `${whole}`;
        return;
      }

      const divisor = gcd(remNumerator, den);
      const simpNum = remNumerator / divisor;
      const simpDen = den / divisor;

      // Render: Proper Fraction
      if (whole === 0) {
        document.getElementById('display-screen').innerHTML = `
          <div class="mixed-number">
            <div class="fraction-part">
              <div class="numerator">${simpNum}</div>
              <div class="denominator">${simpDen}</div>
            </div>
          </div>`;
        lastCalculatedText = `${simpNum}/${simpDen}`;
        return;
      }

      // Render: Mixed Number
      document.getElementById('display-screen').innerHTML = `
        <div class="mixed-number">
          <span class="whole-part">${whole}</span>
          <div class="fraction-part">
            <div class="numerator">${simpNum}</div>
            <div class="denominator">${simpDen}</div>
          </div>
        </div>`;
      lastCalculatedText = `${whole} ${simpNum}/${simpDen}`;
    }

    function showError() {
      document.getElementById('display-screen').innerHTML = `<span class="input-text">Error</span>`;
      lastCalculatedText = "Error";
    }

    function shareResult() {
      const textToShare = lastCalculatedText || inputString;
      if (!textToShare) {
        alert("Nothing to share yet!");
        return;
      }

      if (navigator.share) {
        navigator.share({
          title: 'Fraction Calculation',
          text: `Fraction Result: ${textToShare}`
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textToShare).then(() => {
          alert(`Copied to clipboard: ${textToShare}`);
        });
      }
    }
  </script>
</body>
</html>
