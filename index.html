<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction to Mixed Number Converter</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .converter-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 320px;
    }
    .display {
      background: #f0f2f5;
      border-radius: 8px;
      padding: 16px;
      text-align: right;
      margin-bottom: 16px;
    }
    .input-display {
      font-size: 1.4rem;
      color: #333;
      min-height: 32px;
      word-wrap: break-word;
    }
    .output-display {
      font-size: 1.1rem;
      color: #007aff;
      font-weight: 600;
      min-height: 24px;
      margin-top: 8px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button {
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #e4e6eb;
      color: #1c1e21;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:active {
      background: #d0d2d6;
    }
    button.op-btn {
      background: #d8e4f8;
      color: #0056b3;
    }
    button.clear-btn {
      background: #ffe5e5;
      color: #d93025;
    }
    button.equals-btn {
      grid-column: span 3;
      background: #007aff;
      color: #ffffff;
    }
    button.equals-btn:active {
      background: #005bb5;
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <div class="display">
      <div id="input" class="input-display"></div>
      <div id="output" class="output-display">Enter fraction & press =</div>
    </div>
    <div class="keypad">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>

      <button class="clear-btn" onclick="clearAll()">C</button>
      <button onclick="press('0')">0</button>
      <button class="op-btn" onclick="backspace()">⌫</button>

      <button class="op-btn" onclick="press('/')">/</button>
      <button class="equals-btn" style="grid-column: span 2;" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let inputString = "";

    function press(val) {
      if (val === '/') {
        if (inputString === "" || inputString.includes('/')) return;
      }
      inputString += val;
      document.getElementById('input').innerText = inputString;
    }

    function backspace() {
      inputString = inputString.slice(0, -1);
      document.getElementById('input').innerText = inputString;
    }

    function clearAll() {
      inputString = "";
      document.getElementById('input').innerText = "";
      document.getElementById('output').innerText = "Enter fraction & press =";
    }

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    function convertToMixed(numStr) {
      if (!numStr.includes('/')) return "Enter denominator";
      
      const parts = numStr.split('/');
      const numerator = parseInt(parts[0], 10);
      const denominator = parseInt(parts[1], 10);

      if (isNaN(numerator) || isNaN(denominator)) return "Invalid fraction";
      if (denominator === 0) return "Cannot divide by 0";

      const whole = Math.floor(numerator / denominator);
      const remNumerator = numerator % denominator;

      if (remNumerator === 0) {
        return `= ${whole}`;
      }

      const divisor = gcd(remNumerator, denominator);
      const simplifiedNum = remNumerator / divisor;
      const simplifiedDen = denominator / divisor;

      if (whole === 0) {
        return `= ${simplifiedNum}/${simplifiedDen}`;
      }

      return `= ${whole} ${simplifiedNum}/${simplifiedDen}`;
    }

    function calculate() {
      if (!inputString) return;
      const result = convertToMixed(inputString);
      document.getElementById('output').innerText = result;
    }
  </script>
</body>
</html>
